[project]
name = "debug-http"
version = "0.1.0"
description = "A debug HTTP service that echoes request details back to the caller"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
debug-http = "debug_http.main:cli"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debug_http"]
